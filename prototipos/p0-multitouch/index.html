<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Viewport para celular: sem zoom do usuário e ocupando também a área do recorte (notch) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Hangover Fishing — Protótipo 0 (multitouch)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Área onde o Phaser cria o canvas do jogo -->
  <div id="game"></div>

  <!-- Botão do menu de testes (fora do canvas: um toque aqui não pertence a nenhum jogador) -->
  <button id="menu-button" type="button" aria-label="Abrir menu de testes">☰ TESTES</button>

  <!-- Menu de testes (HTML comum, por cima do jogo) -->
  <div id="menu" hidden>
    <div class="menu-panel" role="dialog" aria-label="Menu de testes">
      <div class="menu-header">
        <strong>Protótipo 0 — Testes de multitouch</strong>
        <button type="button" data-action="close">Fechar ✕</button>
      </div>
      <p class="menu-note">Abrir este menu encerra todos os toques ativos (registrado como "menu aberto").</p>
      <div id="test-list" class="test-list"></div>
      <div class="menu-row">
        <span>Limiar toque × segurar:</span>
        <button type="button" data-action="threshold-down">−25</button>
        <strong id="threshold-value">200 ms</strong>
        <button type="button" data-action="threshold-up">+25</button>
      </div>
      <div class="menu-row">
        <button type="button" data-action="reset">Zerar contadores e registro</button>
        <button type="button" data-action="fullscreen">Tela cheia</button>
        <button type="button" data-action="report">Ver relatório</button>
      </div>
      <div id="report" hidden>
        <p class="menu-note">Selecione todo o texto e copie para o arquivo RESULTADOS.md.</p>
        <textarea id="report-text" readonly></textarea>
      </div>
    </div>
  </div>

  <!-- Phaser 3.90.0 (cópia local, versão fixada) -->
  <script src="lib/phaser.min.js"></script>
  <!-- Lógica de entrada (independente do Phaser) -->
  <script src="src/input/PlayerZone.js"></script>
  <script src="src/input/TouchRouter.js"></script>
  <!-- Interface de diagnóstico -->
  <script src="src/ui/DiagnosticsPanel.js"></script>
  <script src="src/ui/TestMenu.js"></script>
  <!-- Cenas e inicialização -->
  <script src="src/scenes/OrientationScene.js"></script>
  <script src="src/scenes/MultitouchTestScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
